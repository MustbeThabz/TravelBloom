name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p dist
          if [ -d docs ]; then
            cp docs/index.html docs/about.html docs/contact.html docs/style.css docs/script.js docs/.nojekyll dist/
            if [ -f docs/CNAME ]; then cp docs/CNAME dist/; fi
          else
            cp index.html about.html contact.html style.css script.js .nojekyll dist/
            if [ -f CNAME ]; then cp CNAME dist/; fi
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
