<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelBloom - Discover Your Next Adventure</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-plane-departure"></i>
                <span>TravelBloom</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search beaches, temples, countries...">
                <button id="searchBtn" class="search-btn"><i class="fas fa-search"></i></button>
                <button id="clearBtn" class="clear-btn">Clear</button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="social-sidebar">
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
            </div>
            <div class="main-text">
                <h1>EXPLORE<br>DREAM<br><span>DESTINATION</span></h1>
                <p>Embark on a journey of cultural exploration and discovery.
                    TravelBloom connects you with the world's most breathtaking destinations,
                    from serene beaches to ancient temples and vibrant cities.</p>
                <button class="book-btn">Book Now</button>
            </div>
            <div id="recommendations" class="recommendations"></div>
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
